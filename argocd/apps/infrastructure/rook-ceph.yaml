apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph
    targetRevision: v1.14.0
    helm:
      valueFiles:
        - $values/helm/values/rook-ceph-operator.yaml
  sources:
    - repoURL: https://charts.rook.io/release
      chart: rook-ceph
      targetRevision: v1.14.0
      helm:
        valueFiles:
          - $values/helm/values/rook-ceph-operator.yaml
    - repoURL: https://github.com/terri1102/rke2_clsuter
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.rook.io/release
      chart: rook-ceph-cluster
      targetRevision: v1.14.0
      helm:
        valueFiles:
          - $values/helm/values/rook-ceph-cluster.yaml
    - repoURL: https://github.com/terri1102/rke2_clsuter
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: false   # cluster changes should be manual
    syncOptions:
      - CreateNamespace=true
