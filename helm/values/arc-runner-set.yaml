# ARC Runner Scale Set — deployed per repo/org
# helm install arc-runner-set oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#   -n arc-runners --create-namespace -f arc-runner-set.yaml

githubConfigUrl: "https://github.com/YOUR_ORG_OR_REPO"
githubConfigSecret: arc-github-secret

minRunners: 0
maxRunners: 5

containerMode:
  type: kubernetes
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: ceph-block
    resources:
      requests:
        storage: 10Gi

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
