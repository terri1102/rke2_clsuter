# Argo Workflows values
# helm repo add argo https://argoproj.github.io/argo-helm
# helm install argo-workflows argo/argo-workflows -n argo --create-namespace -f argo-workflows.yaml

workflow:
  serviceAccount:
    create: true
    name: argo-workflow

controller:
  workflowNamespaces:
    - argo
    - mlops
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  metricsConfig:
    enabled: true

server:
  authModes:
    - server
  # SSO/Dex 배포 시 아래 블록 활성화 (프로덕션용)
  # sso:
  #   issuer: https://dex.DOMAIN_PLACEHOLDER
  #   clientId:
  #     name: argo-workflows-sso
  #     key: clientId
  #   clientSecret:
  #     name: argo-workflows-sso
  #     key: clientSecret
  #   redirectUrl: https://argo-workflows.DOMAIN_PLACEHOLDER/oauth2/callback
  #   rbac:
  #     enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - argo-workflows.DOMAIN_PLACEHOLDER

artifactRepository:
  s3:
    endpoint: rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local
    bucket: argo-artifacts
    insecure: true
    accessKeySecret:
      name: ceph-s3-secret
      key: AWS_ACCESS_KEY_ID
    secretKeySecret:
      name: ceph-s3-secret
      key: AWS_SECRET_ACCESS_KEY
