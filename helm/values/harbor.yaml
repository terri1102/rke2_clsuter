# Harbor values
# helm repo add harbor https://helm.goharbor.io
# helm install harbor harbor/harbor -n harbor --create-namespace -f harbor.yaml

expose:
  type: ingress
  tls:
    enabled: true
    certSource: auto
  ingress:
    hosts:
      core: harbor.52.78.115.77.nip.io
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod

externalURL: https://harbor.52.78.115.77.nip.io

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      storageClass: ceph-filesystem
      size: 100Gi
    jobservice:
      jobLog:
        storageClass: ceph-block
        size: 10Gi
    database:
      storageClass: ceph-block
      size: 10Gi
    redis:
      storageClass: ceph-block
      size: 5Gi
    trivy:
      storageClass: ceph-block
      size: 10Gi

database:
  type: internal

redis:
  type: internal

trivy:
  enabled: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true

resources:
  core:
    requests:
      cpu: 200m
      memory: 256Mi
  registry:
    requests:
      cpu: 100m
      memory: 256Mi
